services:
  solar-energy-manager:
    image: ghcr.io/macorou/solar-energy-manager:${SEM_VERSION:-0.1.0}
    restart: unless-stopped
    init: true
    ports:
      - "${SEM_HTTP_PORT:-8080}:8080"
    environment:
      SEM_DATA_DIR: /data
      SEM_PUBLIC_URL: "${SEM_PUBLIC_URL:-}"
      SEM_SECURE_COOKIE: "${SEM_SECURE_COOKIE:-false}"
      TZ: Europe/Paris
    volumes:
      - solar_energy_data:/data
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1770
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  solar_energy_data:
